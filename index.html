<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>میڈیا ڈاؤنلوڈر</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f4; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 50px auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        input[type="text"] { width: 80%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 12px 25px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #218838; }
        .ad-space { margin-top: 30px; padding: 20px; background-color: #e9e9e9; border: 1px dashed #bbb; }
    </style>
</head>
<body>
    <div class="container">
        <h1>ویڈیو اور فوٹو ڈاؤنلوڈر</h1>
        <p>اپنا لنک نیچے پیسٹ کریں اور بآسانی ڈاؤن لوڈ کریں</p>
        <input type="text" id="urlInput" placeholder="یہاں لنک پیسٹ کریں...">
        <br>
        <button onclick="downloadMedia()">ڈاؤن لوڈ کریں</button>

        <div class="ad-space">
            <p>یہاں آپ کے اشتہارات آئیں گے</p>
        </div>
    </div>

    <script>
        function downloadMedia() {
            const url = document.getElementById('urlInput').value;
            if (url) {
                alert("لنک موصول ہو گیا ہے: " + url + "\n(نوٹ: اس کے لیے بیک اینڈ سرور درکار ہے)");
            } else {
                alert("براہ کرم کوئی لنک درج کریں۔");
            }
        }
    </script>
</body>
</html>
